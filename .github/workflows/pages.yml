name: Update data and deploy GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore: ['docs/data/updates.json', 'README.md']
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node build.mjs
      - run: node test.mjs
      - name: Collect official news and prices
        run: node scripts/refresh-data.mjs
      - name: Save published update record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/updates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official news and pricing snapshot'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
